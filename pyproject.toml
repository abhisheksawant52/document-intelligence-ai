[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-ai"
version = "0.1.0"
description = "Document intelligence service: OCR, layout analysis, extraction, and classification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = ["document-ai", "ocr", "nlp", "extraction", "classification", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pytesseract>=0.3.10",
  "pdf2image>=1.17",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.0",
  "pre-commit>=3.7",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/abhisheksawant52/document-intelligence-ai"
Repository = "https://github.com/abhisheksawant52/document-intelligence-ai"
Issues = "https://github.com/abhisheksawant52/document-intelligence-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
